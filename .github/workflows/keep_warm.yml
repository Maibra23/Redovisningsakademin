name: Keep warm

# Requests the app every 15 minutes on weekdays, 06 to 18 UTC, to reduce cold
# starts and keep the database active. The address is the APP_URL secret.
on:
  schedule:
    - cron: "*/15 6-17 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set; nothing to request."
            exit 0
          fi
          curl --silent --show-error --location --max-time 60 \
            --output /dev/null --write-out "HTTP %{http_code}\n" "$APP_URL"
