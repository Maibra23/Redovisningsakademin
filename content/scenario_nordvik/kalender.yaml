# The month's events in date order. Each event becomes one document in the Inkorg.
#
# recept names a recipe in src/ra/learning/recipes.py, or one of the scenario's own
# month recipes in src/ra/simulator/scenario.py (lon_manad, arbetsgivaravgifter_manad,
# momsomforing_manad), whose key comes from the employees or from the month's moms.
# parametrar: a whole number is fixed, {min, max, steg} or a list is sampled from the
# run's seed, and {fran, figur} takes a figure from an earlier event, so a payment
# always equals its invoice. Parameters left out use the recipe's default range.
# avser points at the invoice a payment or kreditfaktura concerns: an earlier event,
# or the fakturanummer of an open invoice in ingaende_balanser.yaml.
