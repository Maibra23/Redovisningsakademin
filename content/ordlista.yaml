# Ordlista: the one Swedish term the app uses for each concept, with a one sentence
# definition and the English term. Lessons, feedback and prompts use these terms and
# no synonyms (CLAUDE.md section 8). Add a term here before using a new one.
termer:
  - term: "ackumulerade avskrivningar"
    definition: "Summan av alla avskrivningar som hittills har gjorts på en anläggningstillgång."
    engelska: "accumulated depreciation"
  - term: "affärshändelse"
    definition: "En händelse som ändrar företagets tillgångar, skulder, eget kapital, intäkter eller kostnader och som därför ska bokföras."
    engelska: "business transaction"
  - term: "aktiebolag"
    definition: "En företagsform där ägarna har satsat aktiekapital och normalt inte ansvarar personligen för bolagets skulder."
    engelska: "limited company"
  - term: "aktiekapital"
    definition: "Det kapital som ägarna har satsat i ett aktiebolag och som redovisas i eget kapital."
    engelska: "share capital"
  - term: "anläggningstillgång"
    definition: "En tillgång som ska användas i verksamheten under flera år, till exempel inventarier."
    engelska: "fixed asset"
  - term: "anskaffningsvärde"
    definition: "Det belopp som en tillgång kostade att skaffa, utan avdragsgill moms."
    engelska: "acquisition cost"
  - term: "arbetsgivaravgifter"
    definition: "De avgifter som arbetsgivaren betalar till staten utöver bruttolönen, beräknade som en procentsats av lönen."
    engelska: "employer's social security contributions"
  - term: "arbetsgivardeklaration"
    definition: "Den månatliga deklarationen till Skatteverket med löner, skatteavdrag och arbetsgivaravgifter."
    engelska: "employer's tax return"
  - term: "arkivering"
    definition: "Att spara räkenskapsinformationen ordnat och läsbart under den tid som lagen kräver."
    engelska: "retention of accounting records"
  - term: "avskrivning"
    definition: "Den del av en anläggningstillgångs anskaffningsvärde som bokförs som kostnad för en period."
    engelska: "depreciation"
  - term: "avstämning"
    definition: "En kontroll av att saldot på ett konto stämmer med ett underlag utanför bokföringen."
    engelska: "reconciliation"
  - term: "balansdag"
    definition: "Den dag som balansräkningen avser, oftast räkenskapsårets sista dag."
    engelska: "balance sheet date"
  - term: "balansräkning"
    definition: "En rapport som visar företagets tillgångar, eget kapital och skulder vid en viss tidpunkt."
    engelska: "balance sheet"
  - term: "bankavstämning"
    definition: "En avstämning av bankkontot i huvudboken mot bankens kontoutdrag."
    engelska: "bank reconciliation"
  - term: "BAS-kontoplanen"
    definition: "Den kontoplan som nästan alla svenska företag använder, med fyrsiffriga konton ordnade i kontoklasser."
    engelska: "the BAS chart of accounts"
  - term: "beskattningsunderlag"
    definition: "Det belopp som momsen räknas på, i regel priset utan moms."
    engelska: "taxable amount"
  - term: "bokföringsekvationen"
    definition: "Sambandet att tillgångarna alltid är lika stora som eget kapital plus skulderna."
    engelska: "the accounting equation"
  - term: "Bokföringsnämnden"
    definition: "Den statliga myndighet som ger ut allmänna råd och vägledningar om god redovisningssed."
    engelska: "Swedish Accounting Standards Board"
  - term: "bokföringsskyldighet"
    definition: "Skyldigheten enligt bokföringslagen att bokföra affärshändelser, spara underlag och avsluta bokföringen."
    engelska: "obligation to keep accounts"
  - term: "bokslut"
    definition: "Arbetet med att avsluta bokföringen för en period och ta fram resultat och ställning."
    engelska: "closing of the accounts"
  - term: "bruttolön"
    definition: "Lönen före skatteavdrag."
    engelska: "gross salary"
  - term: "debet"
    definition: "Den vänstra sidan av ett konto, där tillgångar och kostnader ökar."
    engelska: "debit"
  - term: "dubbel bokföring"
    definition: "Principen att varje affärshändelse bokförs på minst två konton med lika stora belopp i debet och kredit."
    engelska: "double-entry bookkeeping"
  - term: "eget kapital"
    definition: "Skillnaden mellan tillgångar och skulder, det vill säga ägarnas del av företaget."
    engelska: "equity"
  - term: "extern redovisning"
    definition: "Redovisning som riktar sig till läsare utanför företaget, till exempel ägare, banker och myndigheter."
    engelska: "financial accounting"
  - term: "faktureringsmetoden"
    definition: "Bokföringsmetoden där fakturor bokförs när de skickas eller tas emot och betalningar bokförs separat."
    engelska: "invoice method"
  - term: "förbrukningsinventarier"
    definition: "Inventarier med lågt värde eller kort livslängd som kostnadsförs direkt i stället för att skrivas av."
    engelska: "low-value equipment"
  - term: "förutbetald intäkt"
    definition: "En betalning som företaget har fått för något som ska levereras i en senare period."
    engelska: "deferred income"
  - term: "förutbetald kostnad"
    definition: "En utgift som företaget har betalat för något som hör till en senare period."
    engelska: "prepaid expense"
  - term: "förvaltningsberättelse"
    definition: "Den del av årsredovisningen som i ord beskriver verksamheten och viktiga händelser under året."
    engelska: "directors' report"
  - term: "god redovisningssed"
    definition: "Det sätt att bokföra och redovisa som följer lag, allmänna råd och praxis."
    engelska: "generally accepted accounting practice"
  - term: "grundbokföring"
    definition: "Bokföring av affärshändelserna i den ordning de registreras."
    engelska: "chronological bookkeeping"
  - term: "handelsvaror"
    definition: "Varor som företaget köper in för att sälja vidare utan att bearbeta dem."
    engelska: "goods for resale"
  - term: "huvudbok"
    definition: "Sammanställningen av alla bokförda poster ordnade per konto."
    engelska: "general ledger"
  - term: "huvudbokföring"
    definition: "Bokföring av affärshändelserna i systematisk ordning, konto för konto."
    engelska: "systematic bookkeeping"
  - term: "ingående balans"
    definition: "Ett kontos saldo vid periodens början."
    engelska: "opening balance"
  - term: "ingående moms"
    definition: "Moms på företagets inköp som företaget får dra av från den moms det ska betala."
    engelska: "input VAT"
  - term: "intäkt"
    definition: "Värdet av det företaget har sålt eller tjänat under en period, som ökar eget kapital."
    engelska: "revenue"
  - term: "inventarier"
    definition: "Maskiner, möbler och annan utrustning som företaget använder i flera år."
    engelska: "equipment"
  - term: "K2"
    definition: "Bokföringsnämndens förenklade regelverk för årsredovisning i mindre företag."
    engelska: "K2 framework for smaller companies"
  - term: "kassa och bank"
    definition: "Balansräkningens post för kontanter och pengar på bankkonton."
    engelska: "cash and bank"
  - term: "kontering"
    definition: "Valet av konton och sidor för en affärshändelse."
    engelska: "account coding"
  - term: "konto"
    definition: "En plats i bokföringen där alla händelser av ett visst slag samlas."
    engelska: "account"
  - term: "kontoklass"
    definition: "En grupp konton i BAS-kontoplanen med samma första siffra."
    engelska: "account class"
  - term: "kontoplan"
    definition: "Förteckningen över de konton som ett företag använder."
    engelska: "chart of accounts"
  - term: "kontoutdrag"
    definition: "Bankens sammanställning av in- och utbetalningar på ett bankkonto."
    engelska: "bank statement"
  - term: "kostnad"
    definition: "Värdet av det som förbrukas i verksamheten under en period, som minskar eget kapital."
    engelska: "expense"
  - term: "kostnadsföra"
    definition: "Att bokföra en utgift som kostnad i resultaträkningen direkt."
    engelska: "to expense"
  - term: "kredit"
    definition: "Den högra sidan av ett konto, där skulder, eget kapital och intäkter ökar."
    engelska: "credit"
  - term: "kreditfaktura"
    definition: "En faktura som helt eller delvis upphäver en tidigare faktura."
    engelska: "credit note"
  - term: "kundfaktura"
    definition: "En faktura som företaget skickar till en kund för en försäljning."
    engelska: "sales invoice"
  - term: "kundfordran"
    definition: "Det belopp som en kund är skyldig företaget för en fakturerad försäljning."
    engelska: "trade receivable"
  - term: "leverantörsfaktura"
    definition: "En faktura som företaget får från en leverantör för ett inköp."
    engelska: "supplier invoice"
  - term: "leverantörsskuld"
    definition: "Det belopp som företaget är skyldigt en leverantör för ett fakturerat inköp."
    engelska: "trade payable"
  - term: "likvida medel"
    definition: "Kontanter och pengar på bankkonton som företaget kan använda direkt."
    engelska: "cash and cash equivalents"
  - term: "lönespecifikation"
    definition: "Ett underlag till den anställde som visar bruttolön, skatteavdrag och nettolön."
    engelska: "payslip"
  - term: "moms"
    definition: "Mervärdesskatt, en skatt på konsumtion som företagen tar ut vid försäljning och redovisar till staten."
    engelska: "value added tax (VAT)"
  - term: "momsavstämning"
    definition: "Kontrollen och omföringen av periodens utgående och ingående moms till momsredovisningskontot."
    engelska: "VAT reconciliation"
  - term: "momsdeklaration"
    definition: "Deklarationen till Skatteverket som visar periodens utgående och ingående moms."
    engelska: "VAT return"
  - term: "momspliktig"
    definition: "Om en försäljning eller verksamhet där moms ska tas ut."
    engelska: "subject to VAT"
  - term: "momsredovisningskonto"
    definition: "Kontot 2650 Redovisningskonto för moms, dit periodens moms förs innan den betalas."
    engelska: "VAT settlement account"
  - term: "momssats"
    definition: "Den procentsats som momsen räknas med, i Sverige 25, 12 eller 6 procent."
    engelska: "VAT rate"
  - term: "motpart"
    definition: "Det företag eller den person som företaget gör affären med."
    engelska: "counterparty"
  - term: "nettolön"
    definition: "Lönen som betalas ut till den anställde efter skatteavdrag."
    engelska: "net salary"
  - term: "nettoomsättning"
    definition: "Resultaträkningens post för intäkter från försäljning av varor och tjänster, utan moms."
    engelska: "net turnover"
  - term: "noter"
    definition: "Tilläggsupplysningar i årsredovisningen som förklarar posterna i rapporterna."
    engelska: "notes"
  - term: "nyttjandeperiod"
    definition: "Den tid som en anläggningstillgång beräknas användas i verksamheten."
    engelska: "useful life"
  - term: "omsättningstillgång"
    definition: "En tillgång som inte är avsedd att användas stadigvarande, till exempel kundfordringar och pengar på banken."
    engelska: "current asset"
  - term: "omvänd betalningsskyldighet"
    definition: "Regeln att köparen i stället för säljaren redovisar och betalar momsen på ett inköp."
    engelska: "reverse charge"
  - term: "periodisering"
    definition: "Att fördela intäkter och kostnader till den period de hör till, oavsett när de betalas."
    engelska: "accrual"
  - term: "prisbasbelopp"
    definition: "Ett belopp som regeringen fastställer för varje år och som används för gränser i skattereglerna."
    engelska: "price base amount"
  - term: "redovisningsperiod"
    definition: "Den period som en momsdeklaration eller arbetsgivardeklaration avser."
    engelska: "reporting period"
  - term: "resultaträkning"
    definition: "En rapport som visar intäkter, kostnader och resultat för en period."
    engelska: "income statement"
  - term: "råbalans"
    definition: "En lista över alla konton med deras saldon, där summan i debet ska vara lika stor som summan i kredit."
    engelska: "trial balance"
  - term: "räkenskapsinformation"
    definition: "Verifikationer, bokföring och andra uppgifter som ska sparas enligt bokföringslagen."
    engelska: "accounting records"
  - term: "räkenskapsår"
    definition: "Den period, oftast tolv månader, som bokföringen och årsredovisningen avser."
    engelska: "financial year"
  - term: "rättelse"
    definition: "En ny verifikation som ändrar effekten av en felaktigt bokförd verifikation."
    engelska: "correction"
  - term: "rörelseresultat"
    definition: "Resultatet av företagets vanliga verksamhet före finansiella poster och skatt."
    engelska: "operating profit"
  - term: "skatteavdrag"
    definition: "Den preliminära skatt som arbetsgivaren drar från den anställdes bruttolön och betalar till Skatteverket."
    engelska: "tax withheld"
  - term: "skattekonto"
    definition: "Företagets konto hos Skatteverket där skatter, avgifter och inbetalningar registreras."
    engelska: "tax account"
  - term: "skuld"
    definition: "Ett belopp som företaget är skyldigt någon annan."
    engelska: "liability"
  - term: "saldo"
    definition: "Skillnaden mellan summan i debet och summan i kredit på ett konto."
    engelska: "balance"
  - term: "T-konto"
    definition: "Ett sätt att rita ett konto med debet till vänster och kredit till höger."
    engelska: "T-account"
  - term: "tillgång"
    definition: "Något av värde som företaget äger eller har rätt till, till exempel pengar, fordringar och inventarier."
    engelska: "asset"
  - term: "underlag"
    definition: "Ett dokument som visar en affärshändelse, till exempel en faktura, ett kvitto eller ett kontoutdrag."
    engelska: "source document"
  - term: "upplupen intäkt"
    definition: "En intäkt som hör till perioden men som ännu inte är fakturerad."
    engelska: "accrued income"
  - term: "upplupen kostnad"
    definition: "En kostnad som hör till perioden men som ännu inte är fakturerad eller betald."
    engelska: "accrued expense"
  - term: "utgående balans"
    definition: "Ett kontos saldo vid periodens slut."
    engelska: "closing balance"
  - term: "utgående moms"
    definition: "Moms som företaget tar ut på sin försäljning och ska betala till staten."
    engelska: "output VAT"
  - term: "utlägg"
    definition: "Ett inköp för företagets räkning som en anställd betalar med egna pengar och får tillbaka senare."
    engelska: "out-of-pocket expense"
  - term: "verifikation"
    definition: "Underlaget för en bokföringspost tillsammans med uppgifterna om hur den har bokförts."
    engelska: "voucher"
  - term: "verifikationsnummer"
    definition: "Det löpnummer som gör att en verifikation kan hittas och kopplas till bokföringen."
    engelska: "voucher number"
  - term: "årets resultat"
    definition: "Skillnaden mellan räkenskapsårets intäkter och kostnader, efter skatt."
    engelska: "profit or loss for the year"
  - term: "årsredovisning"
    definition: "Den årliga rapporten med balansräkning, resultaträkning, noter och förvaltningsberättelse."
    engelska: "annual report"
