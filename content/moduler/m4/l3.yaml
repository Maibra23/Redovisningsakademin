id: m4.l3
modul: m4
titel: "Handel med EU och omvänd betalningsskyldighet"
status: utkast
kompetenser: [C4]
vad: >-
  När företag i olika EU-länder handlar varor och tjänster med varandra gäller omvänd
  betalningsskyldighet (reverse charge) för köpen. Säljaren tar inte ut moms. Köparen
  räknar själv ut momsen i sitt eget land.
varfor: >-
  Momsen ska betalas i det land där varan eller tjänsten används. När köparen redovisar
  momsen hamnar den i rätt land, utan att säljaren behöver registrera sig för moms där.
hur: >-
  Köp av varor från ett företag i ett annat EU-land bokförs i debet på 4075 och 2645 och i
  kredit på 2614 och 2440. Köp av tjänster bokförs på samma sätt men med 4535 i stället
  för 4075. Den utgående och den ingående momsen är lika stora, så nettot blir noll när
  köpet är avdragsgillt. Försäljning av varor till ett momsregistrerat företag i ett
  annat EU-land bokförs i debet på 1510 och i kredit på 3108, utan moms. Försäljning av
  tjänster enligt huvudregeln bokförs i debet på 1510 och i kredit på 3308, utan moms.
  Fakturan ska ange köparens momsregistreringsnummer och varför moms saknas, för varor
  till exempel Undantagen från skatteplikt och för tjänster Omvänd betalningsskyldighet.
nar: >-
  Reglerna gäller när både säljare och köpare är momsregistrerade företag i olika
  EU-länder och, för varor, när varorna transporteras mellan länderna. I
  momsdeklarationen redovisas köp av varor i fält 20, köp av tjänster i fält 21, momsen
  på köpen i fält 30 och avdraget i fält 48. Försäljning av varor redovisas i fält 35
  och försäljning av tjänster i fält 39, och båda även i en periodisk sammanställning.
  Import och export utanför EU, försäljning till privatpersoner och trepartshandel
  ingår inte här.
regler: [ml.16.17, ml.13.6]
exempel:
  text: >-
    Företaget köper kontorsstolar från en tysk leverantör för att sälja dem vidare.
    Fakturan saknar moms. Företaget bokför själv både utgående och ingående moms.
  recept: eu_inkop_varor
  datum: 2026-04-08
  parametrar: {netto_ore: 2000000}
