    summor:
      - {text: "Att betala", belopp: netto}
  - id: eu_forsaljning_tjanst
    dokument: kundfaktura
    titel: "Faktura"
    motpart: "Arbeitsplatz Beratung GmbH, Tyskland"
    text: "Kunden är ett momsregistrerat företag i Tyskland. Fakturan är märkt Omvänd betalningsskyldighet."
    rader:
      - {text: "{beskrivning}", belopp: netto}
    summor:
      - {text: "Att betala", belopp: netto}
